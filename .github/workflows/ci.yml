name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B test
      - name: Compile production sources without Maven
        run: |
          rm -rf /tmp/mini-redis-out
          mkdir -p /tmp/mini-redis-out
          javac --release 21 -Xlint:all -d /tmp/mini-redis-out $(find src/main/java -name "*.java")